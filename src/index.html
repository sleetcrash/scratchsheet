<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Scratch Sheet</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <!-- The sheet is the whole window. No title bar: hold Ctrl and drag anywhere to move. -->
  <main id="sheet"></main>

  <!-- Top-right corner: always on top, theme, Clear, Save, close (hide to tray) -->
  <div id="corner">
    <button id="btn-pin" class="corner-btn corner-icon" aria-label="Always on top" aria-pressed="false"><span class="ico ico-pin"></span></button>
    <button id="btn-theme" class="corner-btn corner-icon" aria-label="Dark mode"><span class="ico ico-dark"></span></button>
    <button id="btn-clear" class="corner-btn corner-danger">Clear</button>
    <button id="btn-save" class="corner-btn">Save</button>
    <button id="btn-hide" class="corner-btn corner-icon corner-close" aria-label="Hide"><span class="ico ico-close"></span></button>
  </div>

  <!-- Shown while Ctrl is held: a transparent drag region over the cells -->
  <div id="drag-overlay" hidden><span>Drag to move</span></div>

  <!-- Bottom-right corner tab: drag it to move the window without holding Ctrl -->
  <div id="drag-handle" aria-hidden="true"><span class="ico ico-drag"></span></div>

  <!-- Floating circles: drag the pair anywhere; palette opens the text tools, 123 the number formats -->
  <div id="fab" class="fab">
    <button id="fab-text" class="fab-circle" aria-label="Text formatting">
      <span class="ico ico-palette"></span>
    </button>
    <button id="fab-number" class="fab-circle" aria-label="Number formats">
      <span class="ico ico-numbers"></span>
    </button>
  </div>

  <div id="toast" hidden></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
